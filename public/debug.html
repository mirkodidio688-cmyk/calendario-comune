<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Debug Tokens</title>
  <style>
    body { font-family: system-ui; padding: 2rem; background: #0b1220; color: #e5e7eb; }
    pre { background: #111827; padding: 1rem; border: 1px solid #334155; overflow: auto; }
    button { padding: 8px 16px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    h1 { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>🔐 Debug Tokens</h1>
  <p>Questa pagina mostra i token salvati (solo per admin).</p>
  <button id="loadTokens">Carica Token</button>
  <pre id="output">Premi il bottone per caricare i token.</pre>

  <script>
    document.getElementById('loadTokens').onclick = async () => {
      try {
        const res = await fetch('/api/debug-tokens');
        const data = await res.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('output').textContent = 'Errore: ' + err.message;
      }
    };
  </script>
</body>
</html>
