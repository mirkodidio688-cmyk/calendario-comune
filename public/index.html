<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calendario condiviso</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Quando siamo liberi?</h1>
    <p>Collega il calendario Google. Evidenziamo slot dove tutti disponibili.</p>
    <a href="/api/auth/login" id="login" class="btn" style="display:inline-block;padding:10px 24px;background:#3b82f6;color:#fff;text-decoration:none;border-radius:6px;">Connetti Google</a>
    <a href="/api/auth/logout" id="logout" class="btn" hidden style="display:inline-block;padding:10px 24px;background:#ef4444;color:#fff;text-decoration:none;border-radius:6px;">Esci</a>
    <span id="who"></span>
  </header>

  <main id="app" hidden>
    <nav>
      <button id="prev">&larr;</button>
      <span id="range"></span>
      <button id="next">&rarr;</button>
      <label>Fuso: <input id="tz" type="text" value="Europe/Rome"></label>
    </nav>
    <div id="grid"></div>
    <details>
      <summary>Amici collegati</summary>
      <ul id="friends"></ul>
      <button id="copyInvite">Copia link invito</button>
      <button id="reconnect">🔄 Riconnetti Google</button>
      <p id="inviteMsg" class="muted"></p>
      <p id="reconnectMsg" class="muted"></p>
    </details>
  </main>

  <script src="/app.js"></script>
</body>
</html>
